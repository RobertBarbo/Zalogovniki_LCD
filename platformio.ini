; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio.local.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/pio_assets.py
build_flags = -include include/tft_setup.h

board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 115200
upload_protocol = espota
upload_port = 192.168.64.51
upload_flags = 

    --timeout=60         ; Poveča timeout na 60 sekund (prej je bilo 10)
; omogoči LittleFS
board_build.filesystem = spiffs

lib_deps = 
    https://github.com/Bodmer/TJpg_Decoder.git
    bodmer/TFT_eSPI
    milesburton/DallasTemperature
    knolleary/PubSubClient

# Ignore RP2040-specific AsyncTCP (AsyncTCP_RP2040W) which can be pulled by some deps
lib_ignore = AsyncTCP_RP2040W
